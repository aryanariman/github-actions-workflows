name: Python Build and Release

on:
  workflow_call:
    inputs:
      files:
        description: "Python files to build"
        required: true
        type: string

      python-version:
        description: "Python version"
        required: false
        default: "3.13"
        type: string

      requirements:
        description: "Requirements file"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

          if ("${{ inputs.requirements }}" -ne "") {
            python -m pip install -r "${{ inputs.requirements }}"
          }

      - name: Build Python files
        shell: powershell
        run: |
          $files = @"
          ${{ inputs.files }}
          "@ -split "`r?`n"

          foreach ($file in $files) {
            $file = $file.Trim()

            if ($file -eq "") {
              continue
            }

            if (!(Test-Path $file)) {
              Write-Error "File not found: $file"
            }

            $name = [System.IO.Path]::GetFileNameWithoutExtension($file)

            Write-Host "Building: $file"
            Write-Host "Output: $name.exe"

            python -m PyInstaller `
              --onefile `
              --clean `
              --name "$name" `
              "$file"

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executables
          path: dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
